[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-chimp"
version = "0.1.0"
description = "Use a Notion database as the source of truth for an outreach sequence, with open and click tracking written back to your own properties."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pytracking>=0.2.2",
    "cryptography>=41",
    "flask>=3.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
]
server = ["gunicorn>=21"]
dev = ["pytest>=8"]

[project.scripts]
notion-chimp = "notion_chimp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
